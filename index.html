<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frugal Swap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F0E6;--surface:#FFFCF5;--ink:#1E2A21;--muted:#667062;--line:#E4DDCD;
  --green:#2F6B3B;--green-2:#245530;--on-green:#FFFFFF;--green-soft:#E3ECD9;--green-ink:#24502D;
  --warn-bg:#FAF0DC;--warn:#7E5310;--heart:#C4473B;--red-soft:#F7E3DF;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131915;--surface:#1B231D;--ink:#E9EEE5;--muted:#9AA696;--line:#2B362D;
  --green:#6DB47A;--green-2:#86C592;--on-green:#0E1A10;--green-soft:#21342A;--green-ink:#A9D9B1;
  --warn-bg:#33291A;--warn:#E6BD78;--heart:#E3796C;--red-soft:#3A2522;}}
:root[data-theme="dark"]{
  --bg:#131915;--surface:#1B231D;--ink:#E9EEE5;--muted:#9AA696;--line:#2B362D;
  --green:#6DB47A;--green-2:#86C592;--on-green:#0E1A10;--green-soft:#21342A;--green-ink:#A9D9B1;
  --warn-bg:#33291A;--warn:#E6BD78;--heart:#E3796C;--red-soft:#3A2522;}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding:12px 18px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;line-height:1.2}
p{margin:0}
.muted{color:var(--muted)}
small{font-size:13px}

/* header */
.brand{text-align:center;padding:20px 0 6px}
.brand h1{font-size:34px;font-weight:800;letter-spacing:-.02em;display:inline-flex;align-items:center;gap:8px}
.brand h1 svg{width:34px;height:34px}
.brand p{color:var(--muted);margin-top:6px;font-size:15px;max-width:26ch;margin-left:auto;margin-right:auto}
.bar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:6px 0 14px}
.bar h1{text-align:center;font-size:19px;font-weight:700}
.ib{width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.ib svg{width:22px;height:22px}
.ib.fav svg{width:24px;height:24px}

/* search */
.sbox{display:flex;gap:8px;align-items:center;margin:16px 0}
.sfield{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 14px;height:54px}
.sfield svg{width:20px;height:20px;color:var(--muted);flex:none}
.sfield input{flex:1;border:0;background:transparent;outline:none;font-size:16px;min-width:0;height:100%}
.sgo{height:54px;width:54px;border-radius:16px;border:0;background:var(--green);color:var(--on-green);display:grid;place-items:center;flex:none}
.sgo svg{width:22px;height:22px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:14px;border:1.5px solid var(--green);background:transparent;color:var(--green);font-weight:700;font-size:15px}
.btn.pri{background:var(--green);color:var(--on-green)}
.btn.on{background:var(--green);color:var(--on-green)}
.btn.full{width:100%}
.btn.ghost{border-color:var(--line);color:var(--ink);font-weight:600}
.btn.bad.on{background:var(--heart);border-color:var(--heart);color:#fff}
.btn svg{width:18px;height:18px}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;color:var(--green);font-weight:600;padding:8px 0;font-size:14px}
.link.danger{color:var(--heart)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}

/* home */
.addbig{width:100%;min-height:56px;font-size:16px;margin-bottom:12px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:26px}
.qt{text-align:left;background:var(--green-soft);border:0;border-radius:18px;padding:14px;color:var(--green-ink)}
.qt b{display:block;font-size:15px}
.qt span{font-size:13px;opacity:.85}
.qt .e{font-size:22px;display:block;margin-bottom:6px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.sec h2{font-size:18px;font-weight:700}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-height:100px}
.cat .e{font-size:28px;line-height:1}
.cat b{font-size:13px;font-weight:600}
.cat small{font-size:11px;color:var(--muted);margin-top:-4px}
.cat.sel{border-color:var(--green);background:var(--green-soft);box-shadow:inset 0 0 0 1px var(--green)}

/* rows */
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;padding:14px;border-top:1px solid var(--line)}
.list>.row:first-child,.list>.mrow:first-child{border-top:0}
.ri{font-size:24px;width:36px;height:36px;display:grid;place-items:center;flex:none}
.rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rt b{font-weight:600;font-size:15px}
.rt small{color:var(--muted)}
.sv{color:var(--green);font-weight:700;font-size:13px}
.chev{color:var(--muted);flex:none}
.mrow{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);padding:6px 6px 6px 8px}
.mrow .row{border:0;padding:10px 6px}
.cb{width:40px;height:40px;border:0;background:transparent;display:grid;place-items:center;flex:none}
.cb i{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center}
.cb.on i{background:var(--green);border-color:var(--green);color:var(--on-green)}
.cb i svg{width:15px;height:15px}
.hb{width:40px;height:40px;border:0;background:transparent;display:grid;place-items:center;color:var(--muted);flex:none}
.hb.on{color:var(--heart)}
.hb svg{width:22px;height:22px}

/* pills + chips */
.pill{display:inline-block;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--green-soft);color:var(--green-ink)}
.pill.soft{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:600}
.st-want{background:var(--warn-bg);color:var(--warn)}
.st-trying{background:var(--warn-bg);color:var(--warn)}
.st-worked{background:var(--green);color:var(--on-green)}
.st-didnt{background:var(--red-soft);color:var(--heart)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--green);border-color:var(--green);color:var(--on-green);font-weight:700}
.wrapchips{display:flex;flex-wrap:wrap;gap:8px}
.tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs .chip{padding:9px 16px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px}
.card h3,.plain h3{font-size:16px;font-weight:700;margin-bottom:8px}
.plain{padding:6px 2px 14px}
.plain p,.card p{color:var(--ink)}
.note{background:var(--green-soft);border-radius:18px;padding:16px;margin-bottom:12px;color:var(--green-ink)}
.note h3{font-size:15px;margin-bottom:4px}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:18px;padding:16px;margin-bottom:12px}
.warnbox h3{font-size:15px;margin-bottom:4px;display:flex;gap:6px;align-items:center}
.warnbox p{color:inherit}
ul.clean{margin:4px 0 0;padding-left:20px}
ul.clean li{margin:4px 0}

/* swap hero */
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start}
.cmp small{color:var(--muted);font-weight:600;display:block;margin-bottom:4px}
.cmp b{font-size:18px;line-height:1.2;display:block;margin-bottom:6px}
.cmp b.g{color:var(--green)}
.cmp p{font-size:14px;color:var(--muted)}
.cmp .arr{font-size:22px;color:var(--green);padding-top:22px}
.cmp .stop small{color:var(--heart)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}

/* form */
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;margin-bottom:14px}
label.f span.h{font-weight:400;color:var(--muted);font-size:13px;margin-top:-2px}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:16px;font-weight:400}
textarea.in{min-height:90px;resize:vertical}
.money{display:flex;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding-left:12px}
.money i{font-style:normal;color:var(--muted)}
.money input{border:0;background:transparent;padding:12px 12px 12px 4px;width:100%;font-size:16px;outline:none}
.money:focus-within,.in:focus{outline:2px solid var(--green);outline-offset:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid2 label.f{font-size:13px}

/* calc tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.tile{background:var(--bg);border-radius:14px;padding:12px}
.tile small{color:var(--muted);display:block}
.tile b{font-size:22px;font-weight:800;letter-spacing:-.01em;display:block;margin-top:2px}
.tile.g{background:var(--green-soft)}
.tile.g b{color:var(--green-ink)}
.calcnote{font-size:13px;color:var(--muted);margin-top:10px}

/* savings */
.shero{background:var(--green-soft);color:var(--green-ink);border-radius:24px;padding:22px 18px;text-align:center;margin-bottom:12px}
.shero h2{font-size:20px;font-weight:800}
.shero .big{display:grid;grid-template-columns:1fr 1px 1fr;gap:10px;margin:14px 0 18px;align-items:center}
.shero .big div b{display:block;font-size:34px;font-weight:800;letter-spacing:-.02em;color:var(--green)}
.shero .big hr{border:0;background:currentColor;opacity:.2;width:1px;height:46px;margin:0}
.shero .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:13px}
.shero .mini b{display:block;font-size:22px}
.prog{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--green);border-radius:99px}

/* plan */
.goals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}
.goal b{display:block;font-size:17px}
.goal small{color:var(--muted);font-size:12px}
.goal.on{border:2px solid var(--green);background:var(--green-soft)}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;margin:12px 0}
.pcard .e{font-size:34px}
.pcard h2{font-size:20px;margin:8px 0 6px}

/* empty */
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty .e{font-size:36px;display:block;margin-bottom:6px}
.empty b{color:var(--ink);display:block;margin-bottom:4px;font-size:16px}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
#nav .in2{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
#nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--muted);font-size:11px;font-weight:600}
#nav button svg{width:24px;height:24px}
#nav button.on{color:var(--green)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.foot{font-size:12px;color:var(--muted);text-align:center;margin:18px 8px 0}
.more .row{padding:16px 14px}
.askov{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.askbox{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:360px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25);font-family:inherit}
.askbox p{margin:0 0 16px;font-size:15px;line-height:1.45}
.askrow{display:flex;gap:10px;justify-content:flex-end}
.askrow button{min-height:44px;padding:0 16px;border-radius:12px;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
.askno{background:transparent;border:1px solid var(--line);color:var(--ink)}
.askyes{background:var(--green);border:1px solid var(--green);color:var(--on-green)}
.setrow{display:flex;align-items:center;gap:12px;padding:14px;border-top:1px solid var(--line);flex-wrap:wrap}
.setrow:first-child{border-top:0}
.setrow .rt{min-width:150px}
.themeseg{display:flex;gap:8px;flex-basis:100%}
.themeseg button{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.themeseg button.on{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.filebtn{position:relative;overflow:hidden;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.tourov{position:fixed;inset:0;z-index:9000;background:rgba(15,22,17,.55);display:flex;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.tourbox{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;max-width:440px;width:100%;max-height:100%;overflow:auto;padding:22px 20px 18px;box-shadow:0 20px 60px rgba(0,0,0,.28)}
.tourtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.tourtop span{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.tourtop .link{padding:4px 0}
.tourico{width:60px;height:60px;border-radius:50%;background:var(--green-soft);display:grid;place-items:center;font-size:30px;margin-bottom:12px}
.tourbox h2{font-size:22px;font-weight:800;letter-spacing:-.01em;margin-bottom:6px}
.tourbox p{color:var(--muted);font-size:15px;margin:6px 0}
.tourbox ul{list-style:none;padding:0;margin:10px 0}
.tourbox li{display:flex;gap:10px;align-items:flex-start;margin:9px 0;font-size:15px}
.tourbox li>span:first-child{flex:none;width:24px;text-align:center}
.tourbox li b{color:var(--ink)}
.tourdots{display:flex;gap:6px;justify-content:center;margin:16px 0 14px}
.tourdots i{width:8px;height:8px;border-radius:99px;background:var(--line)}
.tourdots i.on{width:22px;background:var(--green)}
.tourfoot{display:flex;gap:10px}
.tourfoot .btn{min-height:50px}
.tourlink{display:flex;align-items:center;justify-content:center;gap:6px;margin:-6px auto 4px;background:none;border:0;color:var(--green);font-weight:700;font-size:14px;padding:8px}
.tour-block{position:fixed;inset:0;z-index:9000}
.tour-spot{position:fixed;z-index:9001;border-radius:18px;box-shadow:0 0 0 4px var(--green),0 0 0 9999px rgba(15,22,17,.58);pointer-events:none;transition:all .25s ease}
.tourbox.tour-card{position:fixed;z-index:9002;width:min(380px,calc(100vw - 32px));max-height:calc(100vh - 32px);padding:16px 18px}
.tour-card h2{font-size:20px}
.tour-card .tourdots{margin:12px 0}
.askyes.askdanger{background:var(--heart);border-color:var(--heart);color:#fff}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" aria-label="Main"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* ---------- data ---------- */
const CATS=[["cleaning","Cleaning","🧴"],["kitchen","Kitchen","🍳"],["laundry","Laundry","🧺"],["bath","Bathroom & Period Care","🧻"],["personal","Personal Care","🪥"],["beauty","Beauty & Hair","💄"],["food","Food & Drinks","🍎"],["home","Home","🏠"],["energy","Energy & Utilities","💡"],["clothing","Clothing","👕"],["kids","Kids & Baby","🧸"],["pets","Pets","🐾"],["transport","Transportation","🚗"],["travel","Travel","✈️"],["subs","Subscriptions","💳"],["tech","Tech & Office","💻"],["fun","Entertainment & Hobbies","🎲"],["health","Health & Wellness","🌿"],["gifts","Gifts & Holidays","🎁"],["other","Other","📦"]];
const CAT=Object.fromEntries(CATS.map(c=>[c[0],{n:c[1],i:c[2]}]));
const TYPES={own:"Use what you own",reuse:"Buy once & reuse",diff:"Buy differently",elim:"Eliminate it",reduce:"Reduce it",multi:"Multipurpose swap"};
const FREQ={w:["Weekly",4.33],"2w":["Every 2 weeks",2.17],m:["Monthly",1],"2m":["Every 2 months",.5],"3m":["Every 3 months",1/3],"6m":["Every 6 months",1/6],y:["Yearly",1/12]};
const ST={want:"Want to try",trying:"Trying it",worked:"Worked",didnt:"Didn't work"};

const CATALOG=[
{id:"toilet",c:"cleaning",t:"own",f:"Toilet bowl cleaner",to:"Dish soap",stop:"Separate toilet bowl cleaner for routine cleaning",use:"Dish soap you already keep by the sink",p:3.5,q:"m",up:0,on:.25,how:"Squeeze about a tablespoon of dish soap into the bowl, let it sit 10 to 15 minutes, scrub with the toilet brush, then flush.",why:"Dish soap loosens everyday grime so the brush can lift it away. You already buy it, so there's nothing new to purchase.",no:["Hard-water rings, mineral deposits, or rust stains. These usually need an acidic cleaner made for the job.","When someone in the home is sick and you need to disinfect, not just clean.","Stains that remain after a normal scrub."],w:"Flush first if another cleaner is in the bowl. Never combine toilet cleaners with bleach or with each other.",k:"Acid-based bowl cleaners dissolve mineral buildup that soap can't. One bottle kept for occasional deep cleans can last a long time.",tg:"toilet bathroom bowl cleaner lysol"},
{id:"glass",c:"cleaning",t:"own",f:"Glass cleaner",to:"Vinegar + water",stop:"Store-bought glass spray",use:"Equal parts white vinegar and water in a labeled spray bottle",p:4,q:"2m",up:0,on:.3,how:"Mix 1 part white vinegar with 1 part water in a clean spray bottle and label it. Spray, then wipe with a lint-free or microfiber cloth.",why:"Vinegar cuts film and fingerprints on glass and mirrors for pennies per bottle.",no:["TV, laptop, and phone screens or anti-glare coatings. Use a dry microfiber cloth or the maker's recommended cleaner.","Near natural stone like marble or granite, since acid can etch it.","Heavy greasy film. Add a drop of dish soap or use a degreaser."],w:"Never mix vinegar with bleach: it releases toxic chlorine gas. Don't store vinegar and hydrogen peroxide mixed in the same bottle.",k:"",tg:"windex window mirror glass spray"},
{id:"allpurpose",c:"cleaning",t:"multi",f:"Separate surface sprays",to:"One soap-and-water spray",stop:"Different sprays for counters, tables, sinks, and appliances",use:"A spray bottle of warm water with a few drops of dish soap",p:12,q:"2m",up:2,on:.3,how:"Fill a labeled spray bottle with warm water and add a few drops of dish soap. Spray, wipe with a damp cloth, then dry.",why:"Most day-to-day wiping is just removing dirt, crumbs, and fingerprints, which mild soapy water handles on most sealed surfaces.",no:["When someone is sick or a surface needs disinfecting. Soap cleans but doesn't disinfect. Use a registered disinfectant and follow its label and contact time.","Unsealed wood or delicate finishes. Check the maker's care instructions.","Heavy baked-on grease, where a degreaser may be worth it."],w:"Cleaning removes dirt. Sanitizing reduces germs. Disinfecting kills specific germs listed on the label. This swap only cleans.",k:"Keep one disinfectant on hand for illness in the home.",tg:"all purpose spray counter cleaner kitchen spray bathroom spray cleaning products stainless"},

/* ---------- state + storage ---------- */
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function freshState(){return{v:1,u:{paper:{status:"worked",start:todayISO()},toilet:{status:"worked",start:todayISO()}},custom:[],plan:{step:"setup",goal:50,custom:false,cats:[],picked:[],skipped:[]}}}
let S=freshState();
const LKEY="frugalswap:v1";
/* Appearance: Light or Dark, saved on this device. Light by default. */
const THEME_KEY="frugalswap:theme";
function getTheme(){let t=null;try{t=S.theme}catch(e){}if(!t){try{t=localStorage.getItem(THEME_KEY)}catch(e){}}return t==="dark"?"dark":"light"}
function applyTheme(t){document.documentElement.setAttribute("data-theme",t==="dark"?"dark":"light")}
try{applyTheme(localStorage.getItem(THEME_KEY))}catch(e){applyTheme("light")}
const COPYRIGHT="© 2026 My World Nest. All rights reserved.";
let dbDoc=null,saveT=null;
function normalize(x){const d=freshState();if(!x||typeof x!=="object")return d;return{v:1,u:x.u||{},custom:Array.isArray(x.custom)?x.custom:[],plan:Object.assign(d.plan,x.plan||{}),tourDone:!!x.tourDone,theme:x.theme==="dark"?"dark":(x.theme?"light":undefined)}}
function save(){
  try{localStorage.setItem(LKEY,JSON.stringify(S))}catch(e){}
  if(dbDoc){clearTimeout(saveT);saveT=setTimeout(()=>{dbDoc.set({json:JSON.stringify(S),updated:Date.now()}).catch(()=>{})},700)}
}
async function initStore(){
  try{const raw=localStorage.getItem(LKEY);if(raw)S=normalize(JSON.parse(raw))}catch(e){}
  render();
  if(!S.tourDone)startTour();
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    const uid=user?await user.id():null;
    if(!db||!uid)return;
    dbDoc=db.doc("data/users/"+uid+"/app");
    const snap=await dbDoc.get();
    if(snap.exists){const d=snap.data();if(d&&d.json){S=normalize(JSON.parse(d.json));try{localStorage.setItem(LKEY,JSON.stringify(S))}catch(e){}render();if(S.tourDone&&TOUR_I!=null){TOUR_I=null;renderTour()}}}
    else save();
  }catch(e){}
}

/* ---------- helpers ---------- */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>{n=+n||0;return "$"+(Math.abs(n)>=100?Math.round(n).toLocaleString("en-US"):n.toFixed(2))};
const all=()=>CATALOG.concat(S.custom);
const byId=id=>all().find(s=>s.id===id);
const u=id=>S.u[id]||{};
const uw=id=>S.u[id]||(S.u[id]={});
function eff(s){const o=u(s.id);const g=(k)=>o[k]!=null&&o[k]!==""?o[k]:s[k];return{p:+g("p")||0,q:FREQ[g("q")]?g("q"):"m",up:+g("up")||0,on:+g("on")||0}}
function calc(s){const e=eff(s);const cur=e.p*FREQ[e.q][1];const sv=Math.max(0,cur-e.on);return Object.assign(e,{cur,sv,yr:sv*12,be:(e.up>0&&sv>0)?e.up/sv:null})}
function parseD(s){if(!s)return null;const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
const fmtD=d=>d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
const addM=(d,m)=>new Date(d.getTime()+m*30.44*864e5);
const monthsSince=d=>Math.max(0,(Date.now()-d.getTime())/(30.44*864e5));
function beText(c){if(c.up<=0)return "Saves from day one";if(c.sv<=0)return "Doesn't pay back at these numbers";const m=c.be;if(m<1)return "About "+Math.max(1,Math.round(m*4.33))+" week"+(Math.round(m*4.33)>1?"s":"");return "About "+(m<10?m.toFixed(1):Math.round(m))+" months"}
function words(q){return q.toLowerCase().split(/\s+/).filter(Boolean).map(w=>w.replace(/(es|s)$/,"").replace(/[^a-z0-9&+-]/g,"")).filter(Boolean)}
function hay(s,full){return(s.f+" "+(s.tg||"")+" "+(s.stop||"")+(full?" "+s.to+" "+(s.use||"")+" "+CAT[s.c].n+" "+TYPES[s.t]:"")).toLowerCase()}
function match(q,list,full){const ws=words(q);if(!ws.length)return[];return list.map(s=>{const h=hay(s,full);if(!ws.every(w=>h.includes(w)))return null;let sc=0;const f=s.f.toLowerCase();ws.forEach(w=>{if(f.includes(w))sc+=3;if((s.tg||"").toLowerCase().includes(w))sc+=1});return{s,sc}}).filter(Boolean).sort((a,b)=>b.sc-a.sc||calc(b.s).sv-calc(a.s).sv).map(x=>x.s)}

/* ---------- routing ---------- */
const R={tab:"home",stack:[],q:"",qt:"all",bq:"",myTab:"all"};
const cur=()=>R.stack.length?R.stack[R.stack.length-1]:{v:R.tab};
function go(v,p){R.stack.push({v,p});render();window.scrollTo(0,0)}
function back(){R.stack.pop();render();window.scrollTo(0,0)}
function tab(t){R.tab=t;R.stack=[];render();window.scrollTo(0,0)}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),1800)}
const bar=(title,right)=>`<header class="bar"><button class="ib" data-a="back" aria-label="Back">${I.back}</button><h1>${esc(title)}</h1><span>${right||""}</span></header>`;
const topbar=(title,right)=>`<header class="bar"><span></span><h1>${esc(title)}</h1><span>${right||""}</span></header>`;

function row(s){const c=calc(s),o=u(s.id);return `<button class="row" data-a="open" data-v="${esc(s.id)}"><span class="ri">${CAT[s.c].i}</span><span class="rt"><b>${esc(s.f)} → ${esc(s.to)}</b><small>${TYPES[s.t]}${o.status?" · "+ST[o.status]:""}</small>${c.sv>0?`<span class="sv">Save ~${money(c.sv)}/mo</span>`:""}</span><span class="chev">${I.chev}</span></button>`}
const list=a=>`<div class="list">${a.map(row).join("")}</div>`;
function empty(e,t,sub,btn){return `<div class="empty"><span class="e">${e}</span><b>${t}</b><p>${sub}</p>${btn||""}</div>`}

function searchResults(){

  let r=match(R.q,all(),true);if(R.qt!=="all")r=r.filter(s=>s.t===R.qt);

V.savings=()=>{
  const ok=all().filter(s=>u(s.id).status==="worked");
  const prog=all().filter(s=>["want","trying"].includes(u(s.id).status));
  const mo=ok.reduce((a,s)=>a+calc(s).sv,0);
  const potential=prog.reduce((a,s)=>a+calc(s).sv,0);
  const gone=ok.filter(s=>calc(s).on===0);
  const cats=new Set(ok.map(s=>s.c)).size;
  let life=0,upSpent=0;
  const reuse=all().filter(s=>["worked","trying"].includes(u(s.id).status)&&calc(s).up>0);
  ok.forEach(s=>{const c=calc(s),d=parseD(u(s.id).start);if(d)life+=monthsSince(d)*c.sv-c.up;else life-=c.up});
  reuse.forEach(s=>upSpent+=calc(s).up);
  const hero=`<div class="shero"><h2>${ok.length?"You're on your way!":"Your savings start here"}</h2><p style="font-size:14px;margin-top:4px">${ok.length?"Your successful swaps could save you about:":"Mark a swap as working and your estimates appear here."}</p>
    <div class="big"><div><b>${money(mo)}</b>per month</div><hr><div><b>${money(mo*12)}</b>per year</div></div>
    <div class="mini"><div><b>${gone.length}</b>products eliminated</div><div><b>${ok.length}</b>successful swaps</div><div><b>${cats}</b>categories</div></div></div>`;
  const tiles=`<div class="tiles" style="margin-bottom:12px">
    <div class="tile" style="background:var(--surface);border:1px solid var(--line)"><small>Lifetime savings since starting</small><b>${life>=0?money(life):"−"+money(-life)}</b><small>${life>=0?"after upfront costs":"still paying off upfront costs"}</small></div>
    <div class="tile" style="background:var(--surface);border:1px solid var(--line)"><small>Spent upfront on reusables</small><b>${money(upSpent)}</b><small>${reuse.length} item${reuse.length===1?"":"s"}</small></div>
    <div class="tile" style="background:var(--surface);border:1px solid var(--line)"><small>Recurring purchases eliminated</small><b>${gone.length}</b></div>
    <div class="tile" style="background:var(--surface);border:1px solid var(--line)"><small>If in-progress swaps work</small><b>+${money(potential)}</b><small>per month</small></div></div>`;
  const reuseRows=reuse.map(s=>{const c=calc(s),d=parseD(u(s.id).start)||new Date();let line;
    if(c.sv<=0)line="Doesn't pay back at your current numbers";
    else{const be=addM(d,c.be);if(be<=new Date()){const since=monthsSince(be)*c.sv;line=`Paid for itself ${fmtD(be)}. Since then: ~${money(since)} saved`}else line=`Pays for itself around ${fmtD(be)}`}
    const pct=c.sv>0?Math.min(100,monthsSince(d)/c.be*100):0;
    return `<button class="row" data-a="open" data-v="${esc(s.id)}"><span class="ri">${CAT[s.c].i}</span><span class="rt"><b>${esc(s.to)}: ${money(c.up)}</b><small>${line}</small><span class="prog" style="margin:6px 0 0"><i style="width:${pct.toFixed(0)}%"></i></span></span></button>`}).join("");
  return topbar("Your Savings")+hero+tiles+
   (reuse.length?`<div class="sec"><h2>Reusable purchases</h2></div><div class="list">${reuseRows}</div>`:"")+
   (gone.length?`<div class="sec"><h2>Products I no longer buy</h2></div><div class="wrapchips">${gone.map(s=>`<button class="chip" data-a="open" data-v="${esc(s.id)}">${CAT[s.c].i} ${esc(s.f)}</button>`).join("")}</div>`:"")+
   (ok.length?`<div class="sec"><h2>Successful swaps</h2></div>`+list(ok):"")+
   `<div style="margin-top:16px"><button class="btn pri full" data-a="tab" data-v="search">Find More Swaps</button></div>
   <p class="foot">All numbers are estimates based on what you entered. Adjust any swap's numbers to make them closer to your real spending.</p>`;
};

  <section class="card"><h3>Clean, sanitize, and disinfect are different jobs</h3><ul class="clean"><li><b>Cleaning</b> removes dirt and grime. Soap and water do this well.</li><li><b>Sanitizing</b> lowers the number of germs on a surface.</li><li><b>Disinfecting</b> kills specific germs listed on a product's label, and only when you follow its directions and contact time.</li></ul><p style="margin-top:8px">A swap that cleans does not automatically sanitize or disinfect.</p></section>

/* Before You Buy */
function bybResults(){
  const q=R.bq.trim();if(!q)return "";
  const m=match(q,all(),false);
  if(!m.length)return `<section class="card"><h3>No saved swaps for “${esc(q)}” yet</h3><p class="muted" style="margin-bottom:10px">Ask yourself before buying:</p><ul class="clean"><li>Do I own something that already does this job?</li><li>Is there a reusable version I'd actually use?</li><li>Could I buy a larger size, generic, or concentrate?</li><li>What would happen if I just didn't buy it?</li><li>Does it serve a purpose nothing else can (safety, health, a specific surface)?</li></ul><p style="margin-top:14px"><button class="btn pri" data-a="go" data-v="add" data-p="from:${esc(q)}">${I.plus} Save a swap for this</button></p></section>`;
  const best=Math.max(...m.map(s=>calc(s).sv));
  const g=(ts,t)=>{const a=m.filter(s=>ts.includes(s.t));return a.length?`<div class="sec"><h2>${t}</h2></div>`+list(a):""};
  const keeps=m.filter(s=>s.k);
  const nos=m.filter(s=>s.no&&s.no.length);
  const warns=[...new Set(m.map(s=>s.w).filter(Boolean))];
  return `<div class="shero" style="text-align:left;margin-top:6px"><h2>Before you buy ${esc(q.toLowerCase())}</h2><p style="font-size:14px;margin-top:6px">${m.some(s=>["own","elim"].includes(s.t))?"You may not need to buy this at all.":"There may be a cheaper way to get the same job done."} Potential savings: up to <b>${money(best)}/month</b> (${money(best*12)}/year).</p></div>
  ${g(["own"],"Things you may already own")}${g(["reuse"],"Reusable alternatives")}${g(["diff","multi"],"Cheaper ways to buy it")}${g(["elim","reduce"],"Skip it or use less")}
  <section class="card" style="margin-top:14px"><h3>Does it serve a unique purpose?</h3>${keeps.length?`<ul class="clean">${keeps.map(s=>`<li>${esc(s.k)}</li>`).join("")}</ul>`:`<p>For everyday use, the alternatives above usually do the job. Check the situations below first.</p>`}</section>
  ${nos.length?`<section class="card"><h3>When NOT to use the alternative</h3>${nos.map(s=>`<p style="font-weight:700;margin-top:8px">${esc(s.to)}</p><ul class="clean">${s.no.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`).join("")}</section>`:""}
  ${warns.length?`<div class="warnbox"><h3>⚠️ Safety</h3>${warns.map(w=>`<p style="margin-top:4px">${esc(w)}</p>`).join("")}</div>`:""}`;
}

    <h2 style="font-size:18px;margin:26px 0 4px">Which areas do you want to explore?</h2><p class="muted" style="font-size:14px;margin-bottom:12px">Select as many as you like. None selected means all.</p>
    <div class="cats">${CATS.map(([k,n,i])=>`<button class="cat ${P.cats.includes(k)?"sel":""}" data-a="area" data-v="${k}" aria-pressed="${P.cats.includes(k)}"><span class="e">${i}</span><b>${n}</b></button>`).join("")}</div>

    <div style="margin-top:22px"><button class="btn pri full" data-a="planstart" ${P.goal>0?"":"disabled"}>Create My Plan ✨</button></div>`;
  }

  const pct=Math.min(100,tot/P.goal*100);

      <div class="acts" style="margin-top:14px"><button class="btn pri" data-a="pick" data-v="${esc(s.id)}">I'll try this</button><button class="btn ghost" data-a="skip" data-v="${esc(s.id)}">Skip</button></div><button class="link" data-a="open" data-v="${esc(s.id)}">See details and adjust numbers</button></div>`})()
      :empty("🌿","That's every swap in these areas","Add more areas, add your own swaps, or finish your plan.");
    return bar("Build Your Plan")+progress+card+`<div class="acts"><button class="btn ghost" data-a="planedit">Change goal or areas</button><button class="btn ${tot>=P.goal?"pri":""}" data-a="planfinish">Finish plan</button></div><p class="foot">Nothing is added unless you choose it. Picked swaps go to My Swaps as “Want to try”.</p>`;
  }
  return bar("Your Frugal Plan")+progress+(picked.length?`<div class="sec"><h2>Swaps you chose to try</h2></div>`+list(picked):empty("🌱","No swaps picked","Go back and pick a few that feel doable."))+
   `<p class="foot" style="text-align:left;margin:14px 2px">That's an estimated ${money(tot)}/month, or ${money(tot*12)}/year, if these work for you.</p>
   <div class="acts"><button class="btn pri" data-a="tab" data-v="my">View My Swaps</button><button class="btn ghost" data-a="planreset">Start a new plan</button></div>`;
};

/* Add / edit swap */
V.add=(p)=>{p=p||"";const edit=p.startsWith("edit:")?byId(p.slice(5)):null;
  const pre=edit||{f:p.startsWith("from:")?p.slice(5):"",to:"",c:p.startsWith("cat:")?p.slice(4):"cleaning",t:"own",p:"",q:"m",up:"",on:"",notes:""};
  const st=edit?(u(edit.id).status||"want"):"want";
  const sel=(obj,v)=>Object.entries(obj).map(([k,n])=>`<option value="${k}" ${k===v?"selected":""}>${Array.isArray(n)?n[0]:n}</option>`).join("");
  return bar(edit?"Edit swap":"Add a Swap")+`<p class="muted" style="margin-bottom:16px">Found a new frugal idea? Save it here and it becomes part of your app.</p>
  <label class="f">Product I'm replacing<input class="in" id="a_f" value="${esc(pre.f)}" placeholder="e.g. Paper towels"></label>
  <label class="f">What I'm replacing it with<input class="in" id="a_to" value="${esc(pre.to)}" placeholder="e.g. Reusable fabric towels"></label>
  <div class="grid2"><label class="f">Category<select class="in" id="a_c">${sel(Object.fromEntries(CATS.map(c=>[c[0],c[1]])),pre.c)}</select></label>
  <label class="f">Swap type<select class="in" id="a_t">${sel(TYPES,pre.t)}</select></label>
  <label class="f">Current cost each time<span class="money"><i>$</i><input id="a_p" type="number" inputmode="decimal" min="0" step="0.01" value="${esc(edit?eff(edit).p:"")}" placeholder="0.00"></span></label>
  <label class="f">How often I buy it<select class="in" id="a_q">${sel(FREQ,pre.q)}</select></label>
  <label class="f">Replacement upfront cost<span class="money"><i>$</i><input id="a_up" type="number" inputmode="decimal" min="0" step="0.01" value="${esc(edit?eff(edit).up:"")}" placeholder="0.00"></span></label>
  <label class="f">Replacement cost per month<span class="money"><i>$</i><input id="a_on" type="number" inputmode="decimal" min="0" step="0.01" value="${esc(edit?eff(edit).on:"")}" placeholder="0.00"></span></label></div>
  <label class="f">Did the swap work?<select class="in" id="a_st">${sel({want:"Haven't tried yet",trying:"Trying it now",worked:"Yes, it worked",didnt:"No, it didn't work"},st)}</select></label>
  <label class="f">Notes<textarea class="in" id="a_n" placeholder="How you do it, where you bought it, any cautions">${esc(edit?u(edit.id).notes||edit.how||"":"")}</textarea></label>
  <p id="a_err" style="color:var(--heart);font-size:14px;min-height:20px"></p>
  <button class="btn pri full" data-a="addsave" data-v="${edit?esc(edit.id):""}">${edit?"Save changes":"Save swap"}</button>`;
};

/* ---------- guided tour (spotlight). Walks through the real screens; never changes your data.
   First open, replay from Home or More. ---------- */
const TOUR_SWAP="paper";
const calcCard=()=>{const c=document.getElementById("calc");return c?c.closest(".card"):null};
const TOUR=[
 {go:["home"],sel:[".brand"],e:"👋",h:"Welcome to Frugal Swap",b:`<p>Frugal Swap helps you spend less on the things you buy again and again, without giving up the life you like.</p>`},
 {go:["home"],sel:[".sbox"],e:"🔍",h:"Find a swap",b:`<p>Search for something you buy, like paper towels or coffee pods, to see cheaper ways to handle it.</p>`},
 {go:["home"],sel:[".cats"],e:"🗂️",h:"Or browse by category",b:`<p>Every swap is sorted into categories, from Cleaning to Subscriptions. Tap one to see all its swaps.</p>`},
 {go:["swap",TOUR_SWAP],sel:[".cmp"],e:"💡",h:"Open a swap",b:`<p>Each swap shows what to <b>stop buying</b> and what to <b>use instead</b>, plus why it saves money and how to do it.</p>`},
 {go:["swap",TOUR_SWAP],sel:[calcCard],e:"✏️",h:"Make the numbers yours",b:`<p>Change the price and how often you buy it to match your real spending. Monthly and yearly savings update right away, and <b>Break-even</b> shows how soon a reusable item pays for itself.</p>`},
 {go:["swap",TOUR_SWAP],sel:[".acts"],e:"✅",h:"Track how it goes",b:`<p>Tap <b>Add to My Swaps</b> or <b>I'm Trying This</b>. Later, mark whether it worked for you.</p>`},
 {go:["tab","my"],sel:[".tabs"],e:"📋",h:"My Swaps",b:`<p>Everything you save shows up here, sorted into In Progress, Successful and Favorites.</p>`},
 {go:["tab","savings"],sel:[".shero"],e:"🌱",h:"Watch your savings add up",b:`<p>Savings adds up every swap that worked: what you save per month and per year, and products you no longer buy at all.</p>`},
 {go:["home"],sel:[".quick"],e:"🧰",h:"Extra helpers",b:`<p><b>Before You Buy</b> checks for a cheaper way before you shop. <b>Build Your Plan</b> picks swaps toward a monthly savings goal.</p>`},
 {go:["home"],sel:['#nav button[data-v="more"]'],e:"🎉",h:"You're all set",b:`<p>Settings, Safety basics and this tour live under <b>More</b>. Start with one swap that feels easy. Small swaps add up.</p>`}
];
let TOUR_I=null, tourEls=null;
function tourGo(st){
 const [k,v]=st.go;
 if(k==="home"){ if(R.tab!=="home"||R.stack.length){R.tab="home";R.stack=[];render()} }
 else if(k==="tab"){ if(R.tab!==v||R.stack.length){R.tab=v;R.stack=[];render()} }
 else if(k==="swap"){ const c=cur(); if(!(c.v==="swap"&&c.p===v)){R.tab="home";R.stack=[{v:"swap",p:v}];render()} }
}
function tourTarget(){ if(TOUR_I==null)return null;
 for(const sel of TOUR[TOUR_I].sel){ const el=typeof sel==="function"?sel():document.querySelector(sel); if(el){const r=el.getBoundingClientRect(); if(r.width>0&&r.height>0)return el} }
 return null; }
function renderTour(){
 if(TOUR_I==null){ if(tourEls){Object.values(tourEls).forEach(x=>x.remove());tourEls=null} return; }
 if(!tourEls){
   tourEls={block:document.createElement("div"),spot:document.createElement("div"),card:document.createElement("div")};
   tourEls.block.className="tour-block"; tourEls.spot.className="tour-spot"; tourEls.card.className="tourbox tour-card";
   tourEls.card.setAttribute("role","dialog"); tourEls.card.setAttribute("aria-modal","true"); tourEls.card.setAttribute("aria-labelledby","tourh");
   document.body.append(tourEls.block,tourEls.spot,tourEls.card);
 }
 const t=TOUR[TOUR_I], last=TOUR_I===TOUR.length-1, i=TOUR_I;
 tourEls.card.innerHTML=`<div class="tourtop"><span>${TOUR_I+1} OF ${TOUR.length}</span>${last?"":`<button class="link" data-a="tourend">Skip tour</button>`}</div>
  <h2 id="tourh"><span aria-hidden="true">${t.e}</span> ${t.h}</h2>${t.b}
  <div class="tourdots" aria-hidden="true">${TOUR.map((_,k)=>`<i class="${k===TOUR_I?"on":""}"></i>`).join("")}</div>
  <div class="tourfoot">${TOUR_I>0?`<button class="btn ghost" data-a="tourprev">Back</button>`:""}<button class="btn pri" style="flex:1" data-a="${last?"tourend":"tournext"}">${last?"Start swapping":TOUR_I===0?"Show me around":"Next"}</button></div>`;
 tourEls.card.style.visibility="hidden";
 tourGo(t);
 setTimeout(()=>{ if(TOUR_I!==i||!tourEls)return;
   const el=tourTarget(); if(el) el.scrollIntoView({block:"center",behavior:"auto"});
   placeTour(); tourEls.card.style.visibility="";
   const b=tourEls.card.querySelector(".tourfoot .btn:last-child"); if(b) b.focus({preventScroll:true}); },60);
}
function placeTour(){
 if(TOUR_I==null||!tourEls)return;
 const el=tourTarget(), spot=tourEls.spot, card=tourEls.card;
 const vw=window.innerWidth, vh=window.innerHeight, cw=card.offsetWidth, ch=card.offsetHeight;
 if(!el){ spot.style.cssText="left:50%;top:50%;width:0;height:0"; card.style.left=Math.max(16,(vw-cw)/2)+"px"; card.style.top=Math.max(16,(vh-ch)/2)+"px"; return; }
 const r=el.getBoundingClientRect(), pad=8, top=Math.max(6,r.top-pad), h=Math.min(r.height+pad*2, vh-top-6);
 spot.style.cssText=`left:${r.left-pad}px;top:${top}px;width:${r.width+pad*2}px;height:${h}px`;
 const left=Math.min(Math.max(16,r.left), vw-cw-16), below=top+h+12, above=top-ch-12;
 card.style.left=left+"px"; card.style.top=(below+ch<vh-8?below:above>8?above:vh-ch-16)+"px";
}
window.addEventListener("resize",placeTour);
window.addEventListener("scroll",placeTour,{passive:true});
function startTour(){TOUR_I=0;renderTour()}
function endTour(){TOUR_I=null;renderTour();if(!S.tourDone){S.tourDone=true;save()}if(R.tab!=="home"||R.stack.length){R.tab="home";R.stack=[];render();window.scrollTo(0,0)}}
document.addEventListener("keydown",e=>{if(TOUR_I==null)return;
  if(e.key==="Escape"){e.preventDefault();endTour()}
  else if(e.key==="ArrowRight"&&TOUR_I<TOUR.length-1){TOUR_I++;renderTour()}
  else if(e.key==="ArrowLeft"&&TOUR_I>0){TOUR_I--;renderTour()}});

/* ---------- render ---------- */
function render(){
  applyTheme(getTheme());
  const c=cur();document.getElementById("app").innerHTML=V[c.v](c.p);
  document.getElementById("nav").innerHTML=`<div class="in2">${[["home","Home"],["search","Search"],["my","My Swaps"],["savings","Savings"],["more","More"]].map(([k,n])=>`<button class="${R.tab===k?"on":""}" data-a="tab" data-v="${k}" aria-current="${R.tab===k&&!R.stack.length?"page":"false"}">${I[k==="my"?"swaps":k]}${n}</button>`).join("")}</div>`;
  if(R.focus){const el=document.getElementById(R.focus);if(el){el.focus();const v=el.value;el.value="";el.value=v}R.focus=null}
  if(TOUR_I!=null)setTimeout(placeTour,0);
}


/* in-page confirm box (the viewer blocks browser confirm popups) */
function ask(msg,ok,danger){return new Promise(res=>{const o=document.createElement('div');o.className='askov';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');
o.innerHTML='<div class="askbox"><p></p><div class="askrow"><button type="button" class="askno">Cancel</button><button type="button" class="askyes"></button></div></div>';
o.querySelector('p').textContent=msg;const y=o.querySelector('.askyes');y.textContent=ok||'OK';if(danger)y.classList.add('askdanger');
const k=e=>{if(e.key==='Escape'){e.stopPropagation();e.preventDefault();done(false);}};
const done=v=>{o.remove();document.removeEventListener('keydown',k,true);res(v);};
o.addEventListener('click',e=>{e.stopPropagation();if(e.target===o||e.target.classList.contains('askno'))done(false);else if(e.target===y)done(true);});
document.addEventListener('keydown',k,true);document.body.appendChild(o);y.focus();});}
/* ---------- events ---------- */
function setStatus(id,st){const o=uw(id);if(o.status===st&&st==="want"){delete o.status}else{o.status=st;if((st==="trying"||st==="worked")&&!o.start)o.start=todayISO()}save();render();
  toast({want:o.status?"Added to My Swaps":"Removed from My Swaps",trying:"Marked as trying",worked:"Nice! Marked as successful",didnt:"Noted. It didn't work for you"}[st])}
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el||el.disabled)return;const a=el.dataset.a,v=el.dataset.v;
  switch(a){
   case "theme":{const t=v==="dark"?"dark":"light";try{localStorage.setItem(THEME_KEY,t)}catch(e){}S.theme=t;save();applyTheme(t);render();break}
   case "backup":{const data={app:"Frugal Swap",savedAt:new Date().toISOString(),state:S};const blob=new Blob([JSON.stringify(data,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="frugal-swap-backup-"+todayISO()+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast("Backup saved to your downloads");break}
   case "tourstart":startTour();break;
   case "tournext":TOUR_I=Math.min(TOUR.length-1,TOUR_I+1);renderTour();break;
   case "tourprev":TOUR_I=Math.max(0,TOUR_I-1);renderTour();break;
   case "tourend":endTour();break;
   case "tourbg":if(e.target===el)endTour();break;
   case "tab":tab(v);break;
   case "back":back();break;
   case "go":go(v,el.dataset.p);break;
   case "open":go("swap",v);break;
   case "cat":go("cat",v);break;
   case "homesearch":R.q=document.getElementById("homeq").value;R.focus="q";tab("search");break;
   case "setq":R.q=v;R.focus="q";render();break;
   case "qt":R.qt=v;render();break;
   case "bq":R.bq=v;render();break;
   case "mytab":R.myTab=v;render();break;
   case "fav":{const o=uw(v);o.fav=!o.fav;save();render();toast(o.fav?"Added to favorites":"Removed from favorites");break}
   case "status":setStatus(el.dataset.id,v);break;
   case "check":{const o=uw(v);if(o.status==="worked"){o.status="trying"}else{o.status="worked";if(!o.start)o.start=todayISO()}save();render();break}
   case "remove":{const o=uw(v);delete o.status;delete o.start;save();render();toast("Removed from My Swaps");break}
   case "resetnums":{const o=uw(v);["p","q","up","on"].forEach(k=>delete o[k]);save();render();break}
   case "goal":S.plan.goal=+v;S.plan.custom=false;save();render();break;
   case "goalcustom":S.plan.custom=true;R.focus="goalin";render();break;
   case "area":{const P=S.plan;if(v==="__all"){P.cats=P.cats.length===CATS.length?[]:CATS.map(c=>c[0])}else{P.cats=P.cats.includes(v)?P.cats.filter(x=>x!==v):P.cats.concat(v)}save();render();break}
   case "planstart":S.plan.step="walk";save();render();window.scrollTo(0,0);break;
   case "pick":{S.plan.picked.push(v);const o=uw(v);if(!o.status)o.status="want";save();render();toast("Added to My Swaps");break}
   case "skip":S.plan.skipped.push(v);save();render();break;
   case "planedit":S.plan.step="setup";save();render();break;
   case "planfinish":S.plan.step="done";save();render();window.scrollTo(0,0);break;
   case "planreset":S.plan=Object.assign(freshState().plan,{goal:S.plan.goal});save();render();break;
   case "addsave":{
     const val=id=>document.getElementById(id).value;const f=val("a_f").trim(),to=val("a_to").trim();
     if(!f||!to){document.getElementById("a_err").textContent="Add both the product you're replacing and what you're replacing it with.";return}
     const obj={f,to,stop:f,use:to,c:val("a_c"),t:val("a_t"),p:+val("a_p")||0,q:val("a_q"),up:+val("a_up")||0,on:+val("a_on")||0,how:"",why:"",no:[],w:"",k:"",tg:"",custom:true};
     let id=v;if(id){const i=S.custom.findIndex(s=>s.id===id);S.custom[i]=Object.assign(S.custom[i],obj)}else{id="c"+Date.now().toString(36);S.custom.push(Object.assign({id},obj))}
     const o=uw(id);["p","q","up","on"].forEach(k=>delete o[k]);o.status=val("a_st");o.notes=val("a_n");if((o.status==="trying"||o.status==="worked")&&!o.start)o.start=todayISO();
     save();R.stack.pop();if(!v)R.stack.push({v:"swap",p:id});render();window.scrollTo(0,0);toast(v?"Changes saved":"Swap saved");break}
   case "delete":ask("Delete this swap? This can't be undone.","Delete",true).then(ok=>{if(ok){S.custom=S.custom.filter(s=>s.id!==v);delete S.u[v];S.plan.picked=S.plan.picked.filter(x=>x!==v);save();back();toast("Swap deleted")}});break;
   case "resetall":ask("Reset all your swaps, notes, numbers, and plan? This can't be undone.","Reset everything",true).then(ok=>{if(ok){S=freshState();save();tab("home");toast("Everything reset")}});break;
  }
});
document.addEventListener("input",e=>{const el=e.target,k=el.dataset.in;if(!k)return;
  if(k==="q"){R.q=el.value;document.getElementById("results").innerHTML=searchResults()}
  else if(k==="bq"){R.bq=el.value;document.getElementById("bybr").innerHTML=R.bq.trim()?bybResults():"";if(!R.bq.trim())render(),R.focus=null,document.getElementById("bq").focus()}
  else if(k==="num"){const o=uw(el.dataset.id);o[el.dataset.f]=el.dataset.f==="q"?el.value:(el.value===""?"":Math.max(0,+el.value));save();document.getElementById("calc").innerHTML=calcHTML(byId(el.dataset.id))}
  else if(k==="note"){uw(el.dataset.id).notes=el.value;save()}
  else if(k==="start"){uw(el.dataset.id).start=el.value;save()}
  else if(k==="goal"){S.plan.goal=+el.value||0;save();const b=document.querySelector('[data-a="planstart"]');if(b)b.disabled=!(S.plan.goal>0)}
});
document.addEventListener("change",e=>{const el=e.target;if(el.dataset.in!=="restore"||!el.files||!el.files[0])return;const f=el.files[0];el.value="";
  const r=new FileReader();r.onload=()=>{let d;try{d=JSON.parse(r.result)}catch(err){d=null}
    if(!d||!d.state||d.app!=="Frugal Swap"){toast("That file isn't a Frugal Swap backup");return}
    const when=d.savedAt?new Date(d.savedAt).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}):"earlier";
    ask("Restore the backup from "+when+"? It will replace what's in the app now.","Restore").then(ok=>{if(ok){S=normalize(d.state);S.tourDone=true;save();render();toast("Backup restored")}})};
  r.readAsText(f)});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="homeq"){e.preventDefault();document.querySelector('[data-a="homesearch"]').click()}
  if(e.key==="Enter"&&(e.target.id==="q"||e.target.id==="bq"))e.target.blur()});
initStore();
</script>
</body>
